name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Sürüm TEK yerden gelir (.nvmrc): yerel, CI ve Vercel aynı major'da
          # buluşsun. Sabit "20" yazıldığında CI npm 10, geliştirme makinesi
          # npm 11 kullanıyordu ve npm 11'in ürettiği lockfile'ı npm 10'un
          # `npm ci`si reddediyordu — CI'ın ilk kırılma sebebi buydu.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Sayfalar force-dynamic; derleme sırasında gerçek bir veritabanına
          # ihtiyaç yok, yalnızca değişkenlerin tanımlı olması yeterli.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-secret-ci-secret-ci-secret-32
          ANON_COOKIE_SECRET: ci-secret-ci-secret-ci-secret-32
