name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Sayfalar force-dynamic; derleme sırasında gerçek bir veritabanına
          # ihtiyaç yok, yalnızca değişkenlerin tanımlı olması yeterli.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-secret-ci-secret-ci-secret-32
          ANON_COOKIE_SECRET: ci-secret-ci-secret-ci-secret-32
